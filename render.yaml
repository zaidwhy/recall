services:
  - type: web
    name: recall
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: RECALL_TOKEN
        sync: false
      - key: GEMINI_VISION_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_LIVE_MODEL
        value: gemini-2.5-flash-live
      - key: PYTHONIOENCODING
        value: utf-8
